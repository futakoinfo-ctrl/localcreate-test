<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>貪吃蛇 Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --board-bg: #1e293b;
    --snake: #22c55e;
    --snake-head: #4ade80;
    --food: #f87171;
    --text: #e2e8f0;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 16px;
  }
  #hud span { color: var(--accent); font-weight: bold; }
  canvas {
    background: var(--board-bg);
    border: 3px solid var(--accent);
    border-radius: 8px;
    image-rendering: pixelated;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 32px; margin: 0; color: var(--food); }
  button {
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #0f172a;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  #hint { font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
  <h1>🐍 貪吃蛇</h1>
  <div id="hud">
    <div>分數：<span id="score">0</span></div>
    <div>最高分：<span id="best">0</span></div>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div id="hint">方向鍵 / WASD 移動　空白鍵暫停</div>

  <div id="overlay">
    <h2 id="overlayTitle">遊戲結束</h2>
    <div id="overlayScore"></div>
    <button id="restartBtn">重新開始</button>
  </div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const GRID = 20; // 每格 20px
  const COLS = canvas.width / GRID;
  const ROWS = canvas.height / GRID;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');
  const restartBtn = document.getElementById('restartBtn');

  const BEST_KEY = 'snake_best_score';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  let snake, direction, nextDirection, food, score, speedMs, timer, paused, gameOver;

  function init() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = direction;
    score = 0;
    speedMs = 140;
    paused = false;
    gameOver = false;
    scoreEl.textContent = score;
    overlay.classList.remove('show');
    placeFood();
    if (timer) clearInterval(timer);
    timer = setInterval(tick, speedMs);
  }

  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function tick() {
    if (paused || gameOver) return;
    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y,
    };

    // 撞牆
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return endGame();
    }
    // 撞自己
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      // 稍微加速，最快到 70ms
      if (speedMs > 70) {
        speedMs -= 4;
        clearInterval(timer);
        timer = setInterval(tick, speedMs);
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame() {
    gameOver = true;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, best);
      bestEl.textContent = best;
      overlayTitle.textContent = '🎉 破紀錄了！';
    } else {
      overlayTitle.textContent = '遊戲結束';
    }
    overlayScore.textContent = `本局分數：${score}`;
    overlay.classList.add('show');
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 食物
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food').trim();
    roundRect(food.x * GRID + 2, food.y * GRID + 2, GRID - 4, GRID - 4, 4);

    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0
        ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head').trim()
        : getComputedStyle(document.documentElement).getPropertyValue('--snake').trim();
      roundRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2, 4);
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function setDirection(dx, dy) {
    // 不能直接反向移動
    if (dx === -direction.x && dy === -direction.y) return;
    nextDirection = { x: dx, y: dy };
  }

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break;
      case ' ':
        if (!gameOver) paused = !paused;
        break;
    }
  });

  restartBtn.addEventListener('click', init);

  init();
  draw();
})();
</script>
</body>
</html>
